[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "module-mail"
version = "0.1.0"
description = "Convert unread emails into structured action items."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<51",
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.160,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-genai>=1.0,<2",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8",
  "ruff>=0.9",
]
gui = [
  "streamlit>=1.30.0",
  "httpx>=0.27.0",
]

[project.scripts]
mail-todo-api = "cowork_agent.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
