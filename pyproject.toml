[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "module-mail"
version = "0.1.0"
description = "Convert unread emails into structured action items."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<51",
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.160,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-genai>=1.0,<2",
  "httpx>=0.27,<1",
  "mistralai>=1,<2",
  "python-docx>=1,<2",
  "python-dotenv>=1.0,<2",
  "qdrant-client>=1.9,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8",
  "pytest-xdist>=3.5",
  "ruff>=0.9",
]
gui = [
  "streamlit>=1.30.0",
  "httpx>=0.27.0",
]
postgres = [
  "psycopg[binary,pool]>=3.2,<4",
]

[project.scripts]
mail-todo-api = "cowork_agent.app:main"
mail-todo-worker = "cowork_agent.orchestration.worker:main"
mail-todo-ingest-knowledge = "cowork_agent.ingestion_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." because test modules import shared helpers as `tests.fixtures.*`; without
# it collection only works under `python -m pytest`, which happens to add the CWD.
pythonpath = ["src", "."]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "docs", ".cowork", "build", "dist"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
# Resolve `cowork_agent` from the source tree, so checking a file outside
# src/ (e.g. `mypy scripts/evaluate_retrieval.py`) sees real types instead
# of the un-marked installed distribution.
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["qdrant_client.*"]
ignore_missing_imports = true
