[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "module-mail"
version = "0.1.0"
description = "Convert unread emails into structured action items."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.12,<4",
  "cryptography>=44,<51",
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.160,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "google-genai>=1.0,<2",
  "httplib2>=0.22,<1",
  "langfuse>=3,<4",
  "langgraph>=0.6,<2",
  "httpx>=0.27,<1",
  "mistralai>=1,<2",
  "pdf-inspector>=1.14,<2",
  "python-docx>=1,<2",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "turbovec>=0.8.0",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-xdist>=3.5",
  "ruff>=0.9",
]
postgres = [
  "psycopg[binary,pool]>=3.2,<4",
]
redis = [
  "redis>=5,<7",
]

[project.scripts]
mail-todo-api = "cowork_agent.app:main"
mail-todo-worker = "cowork_agent.orchestration.worker:main"
mail-todo-dev = "cowork_agent.orchestration.dev:main"
mail-todo-ingest-knowledge = "cowork_agent.ingestion_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." because test modules import shared helpers as `tests.fixtures.*`; without
# it collection only works under `python -m pytest`, which happens to add the CWD.
pythonpath = ["src", "."]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "docs", ".cowork", "build", "dist"]
# -n 4 --dist loadgroup: same worker count as the measured loadfile setup.
#   Ungrouped tests still fan out. tests/integration/persistence is one
#   xdist_group so DROP SCHEMA public CASCADE never runs on two workers.
# -m "not live": the live E2E module needs a real server plus Gmail OAuth and
#   costs 20 s of boot before it can even skip. tests/conftest.py prints a
#   yellow banner naming whatever was deselected, so this cannot rot silently.
# --strict-markers: an unregistered marker is a typo that would otherwise make a
#   test silently vanish from every `-m` selection.
addopts = "-n 4 --dist loadgroup -m 'not live' --strict-markers"
markers = [
    "slow: >1s of wall clock on its own. Run with `-m slow`.",
    "live: needs a real external process/service. Deselected by default; skips loudly when absent.",
    "serial: must not run under xdist (spawns subprocesses or binds a fixed port).",
    "xdist_group(name): pin tests that share a destructive resource to one xdist worker.",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
# Resolve `cowork_agent` from the source tree, so checking a file outside
# src/ (e.g. `mypy scripts/evaluate_retrieval.py`) sees real types instead
# of the un-marked installed distribution.
mypy_path = "src"
