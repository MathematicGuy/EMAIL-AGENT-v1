# Local PostgreSQL control plane (ADR-010).
# Same engine and migrations as hosted Supabase; no WAN RTT.
#
#   docker compose up -d postgres
#   DATABASE_URL=postgresql://cowork:cowork_dev_only@127.0.0.1:5432/cowork
#
# Integration tests default to the sibling database `cowork_mail_todo` and
# DROP SCHEMA public — do not point the app at that name.
services:
  postgres:
    image: postgres:16-alpine
    container_name: cowork-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: cowork
      POSTGRES_PASSWORD: cowork_dev_only
      POSTGRES_DB: cowork_mail_todo
    ports:
      - "5432:5432"
    volumes:
      - cowork_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cowork -d cowork_mail_todo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  clamav:
    image: clamav/clamav:latest
    container_name: cowork-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    environment:
      - CLAMAV_NO_FRESHCLAM=false
    volumes:
      - cowork_clamav_data:/var/lib/clamav

volumes:
  cowork_pg_data:
  cowork_clamav_data:
